name: 'GHAS Alert Topics'
description: 'Apply repository topics with GHAS alert counts (secret scanning, code scanning, Dependabot)'
author: 'Whistler'

inputs:
  token:
    description: 'GitHub token with access to security alerts and repository metadata'
    required: true
  organization:
    description: 'GitHub organization name (mutually exclusive with enterprise)'
    required: false
  enterprise:
    description: 'GitHub Enterprise slug (mutually exclusive with organization)'
    required: false
  dry-run:
    description: 'Log what would happen without applying topics'
    required: false
    default: 'false'
  hide-count:
    description: 'If true, apply only the alert type as a topic (e.g. ghas-secret) without the count suffix'
    required: false
    default: 'false'

outputs:
  repositories-processed:
    description: 'Number of repositories processed'
  topics-applied:
    description: 'Number of repositories whose topics were updated'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'tag'
  color: 'orange'
